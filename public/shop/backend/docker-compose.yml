services:
  postgres:
    image: postgres:16-alpine
    container_name: av-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: av_storefront
      POSTGRES_USER: av_store
      POSTGRES_PASSWORD: store_commands_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_internal

  av-store-api:
    build: .
    container_name: av-store-api
    env_file: .env
    restart: unless-stopped
    depends_on:
      - postgres
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8088/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # --- HTTPS (browser / public): keep TLS at edge; Square + customers use this ---
      - "traefik.http.routers.avstoreapi.rule=Host(`api.aerovista.us`)"
      - "traefik.http.routers.avstoreapi.entrypoints=websecure"
      - "traefik.http.routers.avstoreapi.tls=true"
      # Requires Traefik static config to define this resolver (see /srv/core/ops/traefik/traefik.yml on nxcore).
      - "traefik.http.routers.avstoreapi.tls.certresolver=le_dns"
      - "traefik.http.services.avstoreapi.loadbalancer.server.port=8088"
      # --- HTTP on web (80): for Cloudflare tunnel origin only; no redirect for /api/* ---
      # Router 1: /api/* on web → service (no redirect); tunnel hits this and gets 200.
      - "traefik.http.routers.avstoreapi-web.rule=Host(`api.aerovista.us`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.avstoreapi-web.entrypoints=web"
      - "traefik.http.routers.avstoreapi-web.priority=100"
      - "traefik.http.routers.avstoreapi-web.service=avstoreapi"
      # Router 2: everything else on web → redirect to HTTPS (browser still gets HTTPS).
      - "traefik.http.routers.avstoreapi-redirect.rule=Host(`api.aerovista.us`)"
      - "traefik.http.routers.avstoreapi-redirect.entrypoints=web"
      - "traefik.http.routers.avstoreapi-redirect.priority=1"
      - "traefik.http.routers.avstoreapi-redirect.middlewares=avstoreapi-redirect-to-https"
      - "traefik.http.middlewares.avstoreapi-redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.avstoreapi-redirect-to-https.redirectscheme.permanent=true"
      # ---
      # Prevent Traefik from guessing the network (avoids "Defaulting to first available network" warnings).
      - "traefik.docker.network=nxtraefik_default"
    networks:
      - backend_internal
      - nxtraefik

  fulfillment-worker:
    build: .
    container_name: av-store-fulfillment-worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["python", "-m", "workers.fulfillment_worker"]
    networks:
      - backend_internal

  reconcile-worker:
    build: .
    container_name: av-store-reconcile-worker
    env_file: .env
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["python", "-m", "workers.reconcile_worker"]
    networks:
      - backend_internal

volumes:
  pgdata:

networks:
  backend_internal:
    driver: bridge
  nxtraefik:
    external: true
    name: nxtraefik_default
