# Same-origin commerce edge for apparel.aerovista.us.
# Reuses the repository's existing CLOUDFLARE_API_TOKEN secret.
name: Deploy apparel commerce proxy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/apparel-commerce-proxy/**"
      - ".github/workflows/deploy-apparel-commerce-proxy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/apparel-commerce-proxy
          command: deploy

      - name: Skip deploy when token is unavailable
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not configured; leaving the apparel commerce edge unchanged."
