# Proxies gear.aerovista.us/api/* → api.aerovista.us (browser checkout / CORS).
# Requires repo secret CLOUDFLARE_API_TOKEN (Zone:DNS Edit + Account:Workers Scripts Edit).
name: Deploy gear API proxy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/gear-api-proxy/**"
      - ".github/workflows/deploy-gear-api-proxy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/gear-api-proxy
          command: deploy
