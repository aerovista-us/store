# Proxies gear.aerovista.us/api/* → api.aerovista.us (browser checkout / CORS).
# Updates the existing gear-api-proxy Worker only; its production route is already configured in Cloudflare.
# Requires repo secret CLOUDFLARE_API_TOKEN with Workers Scripts (Legacy) Edit and repo variable CLOUDFLARE_ACCOUNT_ID.
name: Deploy gear API proxy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/gear-api-proxy/**"
      - ".github/workflows/deploy-gear-api-proxy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Require Cloudflare deploy credentials
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured. The live Worker would remain unchanged."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured. Wrangler cannot target the AeroVista account safely."
            exit 1
          fi

      - name: Upload Worker version
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare/gear-api-proxy
          command: versions upload --tag github-${{ github.sha }} --message "GitHub ${{ github.sha }}"

      - name: Promote Worker version
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare/gear-api-proxy
          command: versions deploy --version-tag github-${{ github.sha }} --percentage 100 -y

      - name: Verify flagship CORS admission when runner is edge-admitted
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local url="$1"
            local method="$2"
            local expected_status="$3"
            local headers
            local status
            headers="$(mktemp)"

            if [ "$method" = "OPTIONS" ]; then
              status="$(curl --silent --show-error \
                --request OPTIONS \
                --header "Origin: https://apparel.aerovista.us" \
                --header "Access-Control-Request-Method: POST" \
                --header "Access-Control-Request-Headers: content-type" \
                --dump-header "$headers" \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$url")"
            else
              status="$(curl --silent --show-error \
                --header "Origin: https://apparel.aerovista.us" \
                --dump-header "$headers" \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$url")"
            fi

            if [ "$status" = "403" ]; then
              rm -f "$headers"
              return 2
            fi

            if [ "$status" != "$expected_status" ]; then
              echo "::error::$method $url returned HTTP $status; expected $expected_status."
              rm -f "$headers"
              return 1
            fi

            if ! tr -d '\r' < "$headers" | grep -iq '^access-control-allow-origin: https://apparel\.aerovista\.us$'; then
              echo "::error::$method $url did not admit the Apparel origin."
              rm -f "$headers"
              return 1
            fi

            rm -f "$headers"
            return 0
          }

          set +e
          probe "https://gear.aerovista.us/api/square/checkout" "OPTIONS" "204"
          options_rc=$?
          probe "https://gear.aerovista.us/api/square/bootstrap" "GET" "200"
          bootstrap_rc=$?
          set -e

          if [ "$options_rc" -eq 2 ] || [ "$bootstrap_rc" -eq 2 ]; then
            echo "::warning::Cloudflare denied this GitHub-hosted runner with HTTP 403. The Worker version was promoted successfully; run the live CORS acceptance probe from an edge-admitted host such as NXCore."
            exit 0
          fi

          if [ "$options_rc" -ne 0 ] || [ "$bootstrap_rc" -ne 0 ]; then
            exit 1
          fi

          echo "apparel.aerovista.us is admitted by the live Gear proxy."
