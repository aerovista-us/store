# Public AV Gear Shop only → GitHub Pages (gear.aerovista.us)
# Catalog console is NOT published here — see docs/NXCORE_CONSOLE.md
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate protected Gear contracts
        run: |
          npm run audit:overlay
          npm run audit:storefront
          npm run audit:storefront-conversion
          npm run audit:commerce-contract
          npm run audit:commerce-schemas
          npm run audit:commerce-v1-contract

      - name: Build public shop
        env:
          BASE_PATH: /
          PUBLIC_SITE_MODE: shop
          PAGES_CNAME: gear.aerovista.us
        run: npm run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
